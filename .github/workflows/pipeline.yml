name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}
  app_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app_version.outputs.version }}
    steps:
      - id: app_version
        name: Application version creators
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@c241b9febb7a4fc11e88d0e781cbdfcf8abd84a5 # v1.0.17
  gradle_verify:
    name: Validate the kotlin
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      gradle-command: 'BUILD_NUMBER=${{ needs.app_version.outputs.version }} ./gradlew build jacocoTestReport'
      upload-build-artifacts: ${{ github.ref == 'refs/heads/main' }}
      java-version: "21"
      localstack-tag: '3.0'
      postgres-tag: '14.12'
      postgres-db: 'postgres'
      postgres-username: 'root'
      postgres-password: 'dev'
    needs:
      - app_version
  database_schema_report:
    name: Database schema report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:14.12
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: sqs,sns
          AWS_EXECUTION_ENV: "True"
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      DATABASE_ENDPOINT: localhost:5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: dev
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Initialise database
        run: ./gradlew initialiseDatabase

      - name: Generate database schema report
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/database_schema_report@accf37e936517ed39e7a888cf74f0277dab3310e # v1.1.4
        with:
          jdk_tag: '21'
          database_name: postgres
          schema: courtcaseservicetest
          host: localhost
          port: '5432'
          user: root
          password: dev
  build:
    name: Build docker image from hmpps-github-actions
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    needs:
      - app_version
      - gradle_verify
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      image_version: ${{ needs.app_version.outputs.version }}
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ inputs.push || inputs.push == null }}
      docker_multiplatform: false
      download_build_artifacts: true
      generate_sbom: true
      attach_sbom_to_registry: true
      sign_image: true
      additional_docker_build_args: ""
  build_nginx:
    name: Build nginx image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    needs:
      - app_version
      - gradle_verify
      - helm_lint
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      image_name: 'court-case-service-nginx'
      image_version: ${{ needs.app_version.outputs.version }}
      file: nginx/Dockerfile
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ inputs.push || inputs.push == null }}
      docker_multiplatform: false
      generate_sbom: true
      attach_sbom_to_registry: true
      sign_image: true
  deploy_dev:
    name: Deploy to development
    needs: [build, build_nginx, helm_lint]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: 'dev'
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: >-
        --set-string nginx_proxy.deployment.image.tag=${{ needs.build.outputs.app_version }}
  deploy_preprod:
    name: Deploy to preprod
    needs: [build, build_nginx, deploy_dev]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: 'preprod'
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: >-
        --set-string nginx_proxy.deployment.image.tag=${{ needs.build.outputs.app_version }}
  deploy_prod:
    name: Deploy to production
    needs: [build, build_nginx, deploy_preprod]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2
    secrets: inherit
    with:
      environment: 'prod'
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: >-
        --set-string nginx_proxy.deployment.image.tag=${{ needs.build.outputs.app_version }}